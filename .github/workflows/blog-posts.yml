name: Update latest writing
on:
  schedule:
    - cron: "17 3 * * *"   # daily, 09:17 Dhaka time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://mehedieh.github.io/feed.xml"
          max_post_count: 5
