/* ================= App shell ================= */
:root{
  --bg:#f3f2ee; --bg2:#ebe9e3; --panel:#ffffff; --panel2:#faf9f6;
  --ink:#1a1b1e; --ink2:#4a4d55; --ink3:#80838c; --line:#e3e1da; --line2:#d3d0c7;
  --brand:#1f6f5c; --brand-ink:#ffffff; --brand-soft:#e3f0ec; --danger:#b4372b; --danger-soft:#fbeceb;
  --focus:0 0 0 3px rgba(31,111,92,.22);
  --radius:10px; --shadow:0 1px 2px rgba(20,20,20,.05),0 4px 16px rgba(20,20,20,.05);
  --ui: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
:root[data-theme="dark"]{
  --bg:#111214; --bg2:#17181b; --panel:#1b1c20; --panel2:#202126;
  --ink:#ececef; --ink2:#b6b8bf; --ink3:#868891; --line:#2b2d33; --line2:#393b42;
  --brand:#4fb59a; --brand-ink:#0d1f1a; --brand-soft:#1d322c; --danger:#ef7b6f; --danger-soft:#3a1f1d;
  --focus:0 0 0 3px rgba(79,181,154,.28);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ui);font-size:14px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.app{display:grid;grid-template-rows:56px 1fr;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.logo{width:32px;height:32px;border-radius:8px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:"LM Roman",serif;font-size:14px;line-height:1;flex:none;padding-bottom:2px}
.logo .e{display:inline-block;transform:translateY(.22em);margin:0 -.1em 0 -.16em}
.brand small{display:block;font-weight:450;color:var(--ink3);font-size:11px;letter-spacing:0}
.sep-v{width:1px;height:24px;background:var(--line)}
.spacer{flex:1}
.status{display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:12px;white-space:nowrap}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.status.dirty .dot{background:#d29a2a}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font-weight:550;font-size:13px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--panel2);border-color:var(--ink3)}
.btn:focus-visible,.ibtn:focus-visible,.seg button:focus-visible{outline:none;box-shadow:var(--focus)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg2)}
.btn.sm{height:28px;padding:0 9px;font-size:12px;border-radius:7px}
.btn.dashed{border-style:dashed;background:transparent;color:var(--ink2);width:100%}
.btn.dashed:hover{color:var(--brand);border-color:var(--brand);background:var(--brand-soft)}
.btn:disabled{opacity:.45;pointer-events:none}
.ibtn{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;border:0;background:transparent;color:var(--ink3)}
.ibtn:hover{background:var(--bg2);color:var(--ink)}
.ibtn.danger:hover{background:var(--danger-soft);color:var(--danger)}
.ibtn.on{color:var(--brand)}
.ibtn:disabled{opacity:.3;pointer-events:none}

.docbtn{display:flex;align-items:center;gap:8px;max-width:260px;height:34px;padding:0 10px;border-radius:8px;border:1px solid transparent;background:transparent}
.docbtn:hover{background:var(--bg2)}
.docbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}

/* Menus / popovers */
.pop{position:fixed;z-index:50;min-width:230px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:6px;animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:transparent;border-radius:8px;text-align:left;font-size:13px}
.mi:hover,.mi:focus-visible{background:var(--bg2);outline:none}
.mi small{display:block;color:var(--ink3);font-size:11.5px}
.mi .kbd{margin-left:auto}
.mhr{height:1px;background:var(--line);margin:5px 4px}
.mlabel{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);padding:8px 10px 4px;font-weight:600}
.kbd{font-family:var(--mono);font-size:11px;color:var(--ink3);border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
.docrow{display:flex;align-items:center;gap:4px;border-radius:8px}
.docrow:hover{background:var(--bg2)}
.docrow.cur{background:var(--brand-soft)}
.docrow .mi{flex:1;min-width:0}
.docrow .mi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docrow .ibtn{opacity:0}
.docrow:hover .ibtn,.docrow.cur .ibtn{opacity:1}

/* Main layout */
.main{display:grid;grid-template-columns:minmax(380px,460px) minmax(0,1fr);min-height:0;min-width:0}
.side{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--line)}
.tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.tab{position:relative;display:flex;align-items:center;gap:7px;padding:9px 12px 11px;border:0;background:none;color:var(--ink3);font-weight:600;font-size:13px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;border-radius:2px;background:var(--brand)}
.side-body{flex:1;overflow:auto;padding:14px 14px 80px;scrollbar-gutter:stable}
.fmtbar{display:flex;align-items:center;gap:2px;padding:6px 12px;border-bottom:1px solid var(--line);background:var(--panel2);font-size:12px;color:var(--ink3)}
.fmtbar .hint{margin-left:8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.fmtbar code{font-family:var(--mono);font-size:11px;background:var(--bg2);padding:1px 4px;border-radius:4px;color:var(--ink2)}

/* Cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow)}
.card.dragging{opacity:.45}
.card.drop-before{box-shadow:0 -3px 0 0 var(--brand),var(--shadow)}
.card.drop-after{box-shadow:0 3px 0 0 var(--brand),var(--shadow)}
.card-h{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 6px;min-height:46px}
.card-h .grip{cursor:grab;color:var(--ink3);width:22px}
.card-h .grip:active{cursor:grabbing}
.card-title{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;font-weight:650;font-size:14px}
.card-title:hover{border-color:var(--line)}
.card-title:focus{outline:none;border-color:var(--brand);box-shadow:var(--focus);background:var(--panel)}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3);background:var(--bg2);border-radius:5px;padding:2px 6px;font-weight:600;white-space:nowrap}
.card.hidden-sec .card-title{color:var(--ink3);text-decoration:line-through}
.card-b{padding:2px 12px 12px;border-top:1px solid var(--line)}
.card.collapsed .card-b{display:none}
.chev svg{transition:transform .15s}
.card.collapsed > .card-h .chev svg{transform:rotate(-90deg)}

.item{border:1px solid var(--line);border-radius:9px;margin-top:10px;background:var(--panel2)}
.item-h{display:flex;align-items:center;gap:2px;padding:4px 4px 4px 10px;min-height:36px}
.item-h .lbl{flex:1;min-width:0;font-weight:600;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.item-h .lbl em{font-style:normal;color:var(--ink3);font-weight:450}
.item-b{padding:4px 10px 10px}
.item.collapsed .item-b{display:none}
.item.collapsed .chev svg{transform:rotate(-90deg)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;margin-top:8px;min-width:0}
.field > span{font-size:11.5px;font-weight:600;color:var(--ink2)}
.inp,.ta,.sel{width:100%;border:1px solid var(--line2);background:var(--panel);border-radius:7px;padding:7px 9px;font-size:13px;line-height:1.4;transition:border-color .12s,box-shadow .12s}
.inp:hover,.ta:hover,.sel:hover{border-color:var(--ink3)}
.inp:focus,.ta:focus,.sel:focus{outline:none;border-color:var(--brand);box-shadow:var(--focus)}
.inp::placeholder,.ta::placeholder{color:var(--ink3);opacity:.8}
.ta{resize:none;overflow:hidden;min-height:34px;display:block}
.ta.big{min-height:90px;resize:vertical;overflow:auto}
.ta.code{font-family:var(--mono);font-size:12px}

.bullets{margin-top:8px}
.bullets > span{font-size:11.5px;font-weight:600;color:var(--ink2);display:block;margin-bottom:4px}
.bl{display:flex;align-items:flex-start;gap:2px;margin-bottom:5px}
.bl .dot{width:16px;flex:none;text-align:center;color:var(--ink3);padding-top:7px;font-size:12px}
.bl .ta{flex:1}
.bl .acts{display:flex;flex:none;opacity:0;transition:opacity .1s;padding-top:3px}
.bl:hover .acts,.bl:focus-within .acts{opacity:1}
.addrow{display:flex;gap:6px;margin-top:8px}

.contact{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.contact.hc{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) auto}
.contact.sk{grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr) auto;align-items:start}

/* Design panel */
.dgroup{margin-bottom:20px}
.dgroup h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.drow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0}
.drow > label{font-weight:550;font-size:13px}
.seg{display:inline-flex;background:var(--bg2);border-radius:8px;padding:2px;gap:2px;flex-wrap:nowrap;flex:none}
.dgroup .seg{flex-wrap:wrap;flex:0 1 auto;justify-content:flex-end}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:12.5px;font-weight:550;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.swatches{display:flex;gap:6px;align-items:center}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line2);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--brand)}
.sw-custom{position:relative;overflow:hidden;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sw-custom input{position:absolute;inset:-6px;opacity:0;cursor:pointer}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.preset{border:1px solid var(--line2);border-radius:9px;padding:10px;background:var(--panel);text-align:left}
.preset:hover{border-color:var(--brand)}
.preset b{display:block;font-size:13px}
.preset small{color:var(--ink3);font-size:11.5px}
.preset .pv{height:34px;margin-bottom:8px;border-radius:5px;background:#fff;border:1px solid #e5e5e5;padding:6px 8px;font-family:"LM Roman",serif;color:#000;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.preset .pv i{display:block;height:2px;background:#ccc;border-radius:1px}
.preset .pv b{font-size:10px;line-height:1;border-bottom:1px solid currentColor;padding-bottom:2px}
.note{font-size:12px;color:var(--ink3);line-height:1.5;margin:6px 0 0}

/* Preview */
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.ptool{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.ptool .seg{background:var(--bg2)}
.pinfo{font-size:12px;color:var(--ink3);white-space:nowrap}
.pinfo b{color:var(--ink2);font-weight:600}
.zoom{display:flex;align-items:center;gap:2px}
.zoom span{min-width:44px;text-align:center;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.canvas{flex:1;overflow:auto;padding:28px 24px 60px;position:relative}
.pages{display:flex;flex-direction:column;align-items:center;gap:22px}
.pwrap{position:relative;flex:none}
.pwrap .pno{position:absolute;right:0;bottom:-18px;font-size:11px;color:var(--ink3)}
.pwrap .page{transform-origin:0 0;box-shadow:0 1px 3px rgba(0,0,0,.08),0 10px 30px rgba(0,0,0,.10)}
:root[data-theme="dark"] .pwrap .page{box-shadow:0 0 0 1px #000,0 10px 30px rgba(0,0,0,.5)}

.texview{flex:1;overflow:auto;padding:0;display:none;background:var(--panel)}
.texview pre{margin:0;padding:18px 22px 60px;font-family:var(--mono);font-size:12.5px;line-height:1.6;tab-size:2;white-space:pre-wrap;word-break:break-word;counter-reset:ln}
.texview .ln{display:block;padding-left:3.4em;position:relative}
.texview .ln::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:2.6em;text-align:right;color:var(--ink3);opacity:.6}
.tx-c{color:#7d8590;font-style:italic}
.tx-k{color:#1f6f5c;font-weight:600}
.tx-b{color:#a1531a}
.tx-o{color:#6f42c1}
:root[data-theme="dark"] .tx-k{color:#5fd0b0}
:root[data-theme="dark"] .tx-b{color:#e6a36a}
:root[data-theme="dark"] .tx-o{color:#b39af5}
.stage.show-tex .canvas{display:none}
.stage.show-tex .texview{display:block}
.stage.show-tex .zoom{visibility:hidden}

.mobile-switch{display:none}

/* Toast & modal */
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:10px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:pop .15s ease-out}
.toast button{background:transparent;border:0;color:var(--brand);font-weight:700;filter:brightness(1.5);padding:2px 6px}
.modal-bg{position:fixed;inset:0;background:rgba(10,10,12,.45);z-index:70;display:grid;place-items:center;padding:20px;animation:fade .12s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--panel);border-radius:14px;max-width:460px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0 0 6px;font-size:17px}
.modal p,.modal li{color:var(--ink2);line-height:1.55;font-size:13.5px}
.modal ol{padding-left:20px;margin:10px 0}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.empty{padding:14px;text-align:center;color:var(--ink3);font-size:12.5px;border:1px dashed var(--line2);border-radius:9px;margin-top:10px}

/* ================= Responsive ================= */
@media (max-width: 980px){
  .main{grid-template-columns:minmax(0,1fr)}
  .fmtbar .hint{display:none}
  .topbar{min-width:0}
  .side,.stage{grid-area:1/1}
  .app[data-view="preview"] .side{display:none}
  .app[data-view="edit"] .stage{display:none}
  .mobile-switch{display:inline-flex}
  .hide-m{display:none !important}
  .brand small{display:none}
}
@media (max-width: 560px){
  .topbar{gap:6px;padding:0 8px}
  .brand .bt{display:none}
  .docbtn{max-width:130px}
  .btn .lbl-m{display:none}
  .status .st{display:none}
  .grid2{grid-template-columns:1fr}
  .contact.hc{grid-template-columns:minmax(0,1fr) auto;margin-bottom:12px}
  .contact.hc > :nth-child(2){grid-column:1/2;grid-row:2}
  .contact.hc > :nth-child(3){grid-row:1/3;grid-column:2}
  .status{display:none}
  .tag{display:none}
  .docbtn{max-width:120px;padding:0 6px}
  .zoom{display:none}
}

/* ================= CV paper (mirrors the LaTeX template) ================= */
.page{background:#fff;color:#000;position:relative;overflow:hidden;font-family:"LM Roman","Latin Modern Roman","CMU Serif","Computer Modern",Georgia,serif;
  font-size:var(--fs-n);line-height:var(--lh-n);font-kerning:normal;text-rendering:geometricPrecision;-webkit-font-smoothing:auto;
  font-variant-ligatures:common-ligatures;hyphens:manual}
.page .pc{position:absolute;overflow:visible}
.page.measure{position:absolute;left:-99999px;top:0;visibility:hidden;height:auto !important}
.page.measure .pc{position:static}
.page a{color:inherit;text-decoration:none}
.page.ln-underline a{text-decoration:underline;text-decoration-thickness:.4pt;text-underline-offset:1.6pt}
.page.ln-color a{color:var(--accent)}
.blk{display:flow-root;padding-top:max(0pt,var(--pt));margin-top:min(0pt,var(--pt));padding-bottom:max(0pt,var(--pb));margin-bottom:min(0pt,var(--pb));--pt:0pt;--pb:0pt}
.cv-head{text-align:center;--pb:var(--g-head)}
.cv-name{font-size:var(--fs-name);line-height:var(--lh-name2);color:var(--accent);white-space:nowrap}
.nm-smallcaps .cv-name{font-family:"LM Roman Caps","LM Roman",serif}
.nm-bold .cv-name{font-weight:700}
.cv-name .sc{font-size:inherit}
.cv-sub{font-size:var(--fs-s);line-height:var(--lh-s);margin-top:1.2pt}
.cv-contacts{font-size:var(--fs-s);line-height:var(--lh-s);margin-top:1.2pt}
.cv-contacts .sep{display:inline-block;margin:0 .36em}
.cv-sec{--pt:var(--g-sec-b);--pb:var(--g-sec-a);color:var(--accent)}
.cv-sec h2{margin:0;font:inherit;font-size:var(--hd-fs);line-height:var(--hd-lh);font-weight:var(--hd-fw);letter-spacing:var(--hd-ls);border-bottom:.4pt solid var(--accent);padding-bottom:var(--hd-pad)}
.hd-smallcaps .cv-sec{--pt:calc(var(--g-sec-b) + 1.5pt);--pb:calc(var(--g-sec-a) - 2.5pt)}
.hd-smallcaps .cv-sec.ptop{--pt:0pt}
.cv-bul,.cv-skl,.cv-txt{margin-right:-.6pt}
.hd-smallcaps .cv-sec h2{font-family:"LM Roman Caps","LM Roman",serif}
.hd-upper .cv-sec h2{text-transform:uppercase}
.cv-ent{padding-left:var(--indent);--pt:var(--g-ent-b)}
.cv-ent.nob{--pb:var(--g-ent-a)}
.cv-ent.nob.send{--pb:var(--g-send-e)}
.cv-ent.pj{--pt:1.5pt;--pb:var(--pj-b)}
.cv-ent.pj.nob{--pb:var(--g-ent-a)}
.cv-sec.ptop{--pt:0pt}
.cv-row{display:flex;justify-content:space-between;align-items:baseline;gap:1em;width:calc((100% + var(--indent)) * var(--tabw))}
.cv-row .l{min-width:0}
.cv-row .r{white-space:nowrap;text-align:right}
.cv-row.r1{font-size:var(--fs-n);line-height:var(--lh-n)}
.cv-row.r1 .l{font-weight:700}
.cv-row.r2{font-size:var(--fs-s);line-height:var(--lh-s);font-style:italic;margin-top:var(--r2-mt)}
.cv-proj{font-size:var(--fs-s)}
.cv-proj .r{font-size:var(--fs-n)}
.cv-row.r1.cv-proj .l{font-weight:400}
.cv-bul{position:relative;padding-left:calc(var(--indent) + var(--bul-in));font-size:var(--fs-s);line-height:var(--lh-b);--pb:var(--g-item)}
.cv-bul::before{content:var(--bul);position:absolute;left:calc(var(--indent) + var(--bul-in) - var(--bul-sep) - 2em);width:2em;text-align:right;font-size:var(--bul-fs)}
.cv-bul.last{--pb:var(--g-list-end)}
.cv-bul.last.send{--pb:calc(var(--g-list-end) + var(--g-send-b))}
.cv-bul.first{--pt:var(--g-list-start)}
.cv-skl{padding-left:var(--indent);font-size:var(--fs-s);line-height:var(--lh-s);--pb:var(--g-skill)}
.cv-skl.first{--pt:var(--g-skl-start)}
.cv-skl.last{--pb:var(--g-skl-end)}
.cv-txt{padding-left:var(--indent);font-size:var(--fs-s);line-height:var(--lh-s)}
.cv-txt.first{--pt:var(--g-skl-start)}
.cv-txt.last{--pb:var(--g-skl-end)}
.cv-txt.gap{--pt:5pt}
.page b,.page strong{font-weight:700}
.page i,.page em{font-style:italic}
.page b i,.page i b{font-style:italic;font-weight:700}

/* ================= Print ================= */
#print-root{display:none}
@media print{
  html,body{height:auto;overflow:visible;background:#fff}
  body > *:not(#print-root){display:none !important}
  #print-root{display:block}
  #print-root .page{box-shadow:none;break-after:page;page-break-after:always;margin:0}
  #print-root .page:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<div class="app" id="app" data-view="edit">
  <header class="topbar">
    <div class="brand"><div class="logo" aria-hidden="true">T<span class="e">E</span>X</div><div class="bt">Typeset<small>LaTeX CV Studio</small></div></div>
    <div class="sep-v hide-m"></div>
    <button class="docbtn" id="docBtn" aria-haspopup="menu" title="Your CVs"><svg class="i"><use href="#i-files"/></svg><span id="docName">CV</span><svg class="i" style="width:14px;color:var(--ink3)"><use href="#i-chev"/></svg></button>
    <div class="status" id="status" aria-live="polite"><span class="dot"></span><span class="st">Saved on this device</span></div>
    <div class="spacer"></div>
    <button class="ibtn hide-m" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="i"><use href="#i-undo"/></svg></button>
    <button class="ibtn hide-m" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg class="i"><use href="#i-redo"/></svg></button>
    <button class="ibtn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode"><svg class="i"><use href="#i-moon"/></svg></button>
    <div class="seg mobile-switch" role="tablist" aria-label="View">
      <button data-view="edit" aria-pressed="true">Edit</button><button data-view="preview" aria-pressed="false">Preview</button>
    </div>
    <button class="btn hide-m" id="importBtn"><svg class="i"><use href="#i-upload"/></svg><span class="lbl-m">Import</span></button>
    <button class="btn primary" id="exportBtn" aria-haspopup="menu"><svg class="i"><use href="#i-download"/></svg><span class="lbl-m">Export</span></button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </header>

  <div class="main">
    <aside class="side" aria-label="Editor">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="content" aria-selected="true"><svg class="i"><use href="#i-pen"/></svg>Content</button>
        <button class="tab" role="tab" data-tab="design" aria-selected="false"><svg class="i"><use href="#i-sliders"/></svg>Design</button>
      </div>
      <div class="fmtbar" id="fmtbar">
        <button class="ibtn" data-fmt="b" title="Bold (Ctrl+B)" aria-label="Bold"><svg class="i"><use href="#i-bold"/></svg></button>
        <button class="ibtn" data-fmt="i" title="Italic (Ctrl+I)" aria-label="Italic"><svg class="i"><use href="#i-italic"/></svg></button>
        <button class="ibtn" data-fmt="a" title="Link (Ctrl+K)" aria-label="Link"><svg class="i"><use href="#i-link"/></svg></button>
        <span class="hint"><code>**bold**</code> <code>*italic*</code> <code>[text](url)</code> · Enter adds a bullet</span>
      </div>
      <div class="side-body" id="editor"></div>
    </aside>

    <section class="stage" id="stage" aria-label="Preview">
      <div class="ptool">
        <div class="seg" role="tablist">
          <button data-pview="pdf" aria-pressed="true">Preview</button>
          <button data-pview="tex" aria-pressed="false">LaTeX</button>
        </div>
        <span class="pinfo" id="pinfo"></span>
        <div class="spacer"></div>
        <div class="zoom">
          <button class="ibtn" id="zoomOut" title="Zoom out" aria-label="Zoom out"><svg class="i"><use href="#i-zout"/></svg></button>
          <span id="zoomVal">100%</span>
          <button class="ibtn" id="zoomIn" title="Zoom in" aria-label="Zoom in"><svg class="i"><use href="#i-zin"/></svg></button>
          <button class="ibtn" id="zoomFit" title="Fit width" aria-label="Fit width"><svg class="i"><use href="#i-fit"/></svg></button>
        </div>
        <div class="texacts" id="texActs" style="display:none;gap:6px">

    hist.past.push(hist.last); if (hist.past.length > 150) hist.past.shift();
    hist.future = []; hist.last = s; updateHistBtns();
  };
  immediate ? run() : (hist.timer = setTimeout(run, 500));
}
function histApply(s) {
  const o = JSON.parse(s);
  doc.header = o.header; doc.sections = o.sections; doc.design = o.design;
  hist.last = s; persist(); renderEditor(); renderPreview(); updateHistBtns();

function undo() { histCommit(true); if (!hist.past.length) return; hist.future.push(hist.last); histApply(hist.past.pop()); }
function redo() { if (!hist.future.length) return; hist.past.push(hist.last); histApply(hist.future.pop()); }

/* ---------------------------------------------------------------------

function getPath(o, p) { return p.split('.').reduce((a, k) => a == null ? a : a[k], o); }

/* ---------------------------------------------------------------------

   --------------------------------------------------------------------- */
function parseInline(s) {
  s = String(s ?? '');
  const out = []; let buf = '', i = 0;
  const flush = () => { if (buf) { out.push({ t: 'x', v: buf }); buf = ''; } };
  while (i < s.length) {
    const c = s[i];
    if (c === '\\' && i + 1 < s.length && '*[]()\\'.includes(s[i + 1])) { buf += s[i + 1]; i += 2; continue; }
    if (c === '*' && s[i + 1] === '*') {
      const j = s.indexOf('**', i + 2);
      if (j > i + 2) { flush(); out.push({ t: 'b', c: parseInline(s.slice(i + 2, j)) }); i = j + 2; continue; }
    } else if (c === '*') {
      const j = s.indexOf('*', i + 1);

}

function normUrl(u) {
  u = String(u || '').trim();
  if (!u) return '';
  if (/^(https?|mailto|tel|ftp):/i.test(u)) return u;
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u)) return 'mailto:' + u;
  if (/^\+?[\d\s().-]{7,}$/.test(u)) return 'tel:' + u.replace(/[^\d+]/g, '');
  return 'https://' + u.replace(/^\/+/, '');
}
function autoUrl(text) {
  const t = String(text || '').trim();
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t)) return 'mailto:' + t;
  if (/^(https?:\/\/)?(www\.)?[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(t) && /[a-z]/i.test(t)) return normUrl(t);
  return '';
}

/* ---- HTML render ---- */
// Typographic quotes, matching what pdfLaTeX produces from `` '' ` '
function smartQuotes(s) {
  return s.replace(/(^|[\s(\[{\u2014\u2013-])"/g, '$1\u201C').replace(/"/g, '\u201D')
          .replace(/(^|[\s(\[{\u2014\u2013-])'/g, '$1\u2018').replace(/'/g, '\u2019');
}
function inlineHTML(s) { return nodesHTML(parseInline(s)); }
function nodesHTML(ns) {
  return ns.map(n => n.t === 'x' ? escH(smartQuotes(n.v)).replace(/---/g, '—').replace(/--/g, '–')

    : n.t === 'i' ? `<i>${nodesHTML(n.c)}</i>`

/* ---- LaTeX render ---- */
function texEsc(s) {

    }[c]))
    .replace(/—/g, '---').replace(/–/g, '--').replace(/…/g, '\\ldots{}')
    .replace(/[“”]/g, m => m === '“' ? '``' : "''").replace(/[‘’]/g, m => m === '‘' ? '`' : "'")

const inlineTeX = s => nodesTeX(parseInline(s));

/* ---------------------------------------------------------------------

   --------------------------------------------------------------------- */
const SIZES = {

  11: { n: [10.95, 13.6], s: [10, 12], l: [12, 14], LARGE: [17.28, 22], huge: [20.74, 25], Huge: [24.88, 30] },
  12: { n: [12, 14.5], s: [10.95, 13.6], l: [14.4, 18], LARGE: [20.74, 25], huge: [24.88, 30], Huge: [24.88, 30] },
};

  //               css (pt)                                                       latex (pt)
  compact: { head: 9, secB: 2, secA: 0.5, ent: 0, entA: 3, item: -0.8, lstart: 1, lend: -1, sendB: 2, sendE: 0, skill: 1, sklS: 1, sklE: 6,

const PX = 96; // CSS px per inch

const SIZE_ADJ = {

    '--fs-n': pt(S.n[0]), '--lh-n': pt(S.n[1]), '--fs-s': pt(S.s[0]), '--lh-s': pt(S.s[1]),
    '--fs-name': pt(name[0]), '--lh-name': pt(name[1]),

    '--lh-name2': pt(name[0] * 0.926 - (name[0] - 17.28) * 0.18), '--accent': d.accent || '#000', '--indent': d.indent + 'in', '--tabw': d.indent ? '0.97' : '1',
    '--bul': B.css, '--bul-fs': B.fs, '--bul-in': '0.4in', '--bul-sep': (S.n[0] * 0.75).toFixed(2) + 'pt', '--lh-b': (S.s[0] * D.t.lead).toFixed(2) + 'pt',
    '--g-head': pt(D.head), '--g-sec-b': pt(D.secB), '--g-sec-a': pt(D.secA), '--g-ent-b': pt(D.ent), '--g-ent-a': pt(D.entA),
    '--g-item': pt(D.item), '--g-list-start': pt(D.lstart), '--g-list-end': pt(D.lend), '--g-send-b': pt(D.sendB), '--g-send-e': pt(D.sendE), '--r2-mt': pt(0.2 + (D.r2 || 0)), '--pj-b': pt(0.5 + (D.pjb || 0)),
    '--g-skill': pt(D.skill), '--g-skl-start': pt(D.sklS), '--g-skl-end': pt(D.sklE),

function nameHTML(name, style) {

function buildBlocks(d) {

  });

  for (const s of d.sections) {
    if (s.hidden || !sectionHasContent(s)) continue;
    if (B.length) B[B.length - 1].html = B[B.length - 1].html.replace('class="blk ', 'class="blk send ');
    B.push({ html: `<div class="blk cv-sec"><h2>${inlineHTML(s.title)}</h2></div>`, keep: true });
    if (s.type === 'entries' || s.type === 'projects') {
      for (const it of s.items) {
        if (!itemHasContent(s.type, it)) continue;
        const bl = (it.bullets || []).filter(x => String(x).trim());
        let head;
        if (s.type === 'entries') {
          head = `<div class="cv-row r1"><span class="l">${inlineHTML(it.title)}</span><span class="r">${inlineHTML(it.location)}</span></div>`;
          if (it.subtitle || it.date) head += `<div class="cv-row r2"><span class="l">${inlineHTML(it.subtitle)}</span><span class="r">${inlineHTML(it.date)}</span></div>`;
        } else {
          let l = `<b>${inlineHTML(it.name)}</b>`;
          if (it.tech) l += ` <span>|</span> <i>${inlineHTML(it.tech)}</i>`;
          if (it.url || it.linkLabel) {
            const lab = it.linkLabel || it.url.replace(/^https?:\/\//, '');
            l += ` (${it.url ? `<a href="${escH(normUrl(it.url))}" target="_blank" rel="noopener">${inlineHTML(lab)}</a>` : inlineHTML(lab)})`;
          }
          head = `<div class="cv-row r1 cv-proj"><span class="l">${l}</span><span class="r">${inlineHTML(it.date)}</span></div>`;
        }
        B.push({ html: `<div class="blk cv-ent${bl.length ? '' : ' nob'}${s.type === 'projects' ? ' pj' : ''}">${head}</div>`, keep: bl.length > 0 });
        bl.forEach((b, i) => B.push({ html: `<div class="blk cv-bul${i === 0 ? ' first' : ''}${i === bl.length - 1 ? ' last' : ''}">${inlineHTML(b)}</div>` }));
      }
    } else if (s.type === 'skills') {
      const its = s.items.filter(x => x.label.trim() || x.value.trim());
      its.forEach((x, i) => B.push({ html: `<div class="blk cv-skl${i === 0 ? ' first' : ''}${i === its.length - 1 ? ' last' : ''}">${x.label.trim() ? `<b>${inlineHTML(x.label)}</b>: ` : ''}${inlineHTML(x.value)}</div>` }));
    } else if (s.type === 'list') {
      const bl = s.bullets.filter(x => String(x).trim());
      bl.forEach((b, i) => B.push({ html: `<div class="blk cv-bul${i === 0 ? ' first' : ''}${i === bl.length - 1 ? ' last' : ''}">${inlineHTML(b)}</div>` }));
    } else if (s.type === 'text') {
      const lines = String(s.text || '').split('\n');
      const out = []; let gap = false;
      for (const ln of lines) { if (!ln.trim()) { gap = out.length > 0; continue; } out.push({ ln, gap }); gap = false; }
      out.forEach((o, i) => B.push({ html: `<div class="blk cv-txt${i === 0 ? ' first' : ''}${i === out.length - 1 ? ' last' : ''}${o.gap ? ' gap' : ''}">${inlineHTML(o.ln)}</div>`, keep: i === 0 && out.length > 1 }));
    }
  }
  return B;
}
function itemHasContent(type, it) {
  if (type === 'projects') return [it.name, it.tech, it.date, it.linkLabel, it.url, ...(it.bullets || [])].some(x => String(x || '').trim());
  return [it.title, it.location, it.subtitle, it.date, ...(it.bullets || [])].some(x => String(x || '').trim());
}
function sectionHasContent(s) {
  if (s.type === 'entries' || s.type === 'projects') return s.items.some(it => itemHasContent(s.type, it));
  if (s.type === 'skills') return s.items.some(x => x.label.trim() || x.value.trim());
  if (s.type === 'list') return s.bullets.some(x => String(x).trim());
  if (s.type === 'text') return !!String(s.text || '').trim();
  return false;
}

function pageClass(d) {
  return `page hd-${d.headingStyle} nm-${d.nameStyle} ln-${d.linkStyle}`;
}
function applyVars(el, d) { const v = pageVars(d); for (const k in v) el.style.setProperty(k, v[k]); }

let lastPages = [];
function paginate() {
  const d = doc.design, P = PAPER[d.paper] || PAPER.letter;
  const W = P.w * PX, H = P.h * PX, mx = d.marginX * PX, my = d.marginY * PX;
  const blocks = buildBlocks(doc);
  const m = document.createElement('div');
  m.className = pageClass(d) + ' measure';
  applyVars(m, d);
  m.style.width = W + 'px';
  m.innerHTML = `<div class="pc" style="width:${W - 2 * mx}px">${blocks.map(b => b.html).join('')}</div>`;
  document.body.appendChild(m);
  const els = $$('.pc > .blk', m);
  // Block heights from successive offsets (handles negative spacing); trailing space may overflow a page, like TeX glue
  const tops = els.map(e => e.getBoundingClientRect().top);
  const endY = $('.pc', m).getBoundingClientRect().bottom;
  const hs = tops.map((t, i) => (i + 1 < tops.length ? tops[i + 1] : endY) - t);
  const pb = els.map(e => { const cs = getComputedStyle(e); return (parseFloat(cs.paddingBottom) || 0) + (parseFloat(cs.marginBottom) || 0); });
  m.remove();
  const avail = H - 2 * my + 3.5 * PX / 72; // TeX measures to the last baseline; allow descender overhang
  const pages = [[]]; let used = 0;
  for (let i = 0; i < blocks.length; i++) {
    // keep-with-next chain
    let need = hs[i], j = i;
    while (blocks[j] && blocks[j].keep && j + 1 < blocks.length) { j++; need += hs[j]; if (!blocks[j].keep) break; }
    let html = blocks[i].html;
    if (used > 0 && used + need - pb[j] > avail) { pages.push([]); used = 0; }
    if (used === 0 && pages.length > 1) html = html.replace('class="blk ', 'class="blk ptop ');
    pages[pages.length - 1].push(html); used += hs[i];
  }
  const fill = used / (H - 2 * my);
  return { pages, W, H, mx, my, fill };
}

let rafId = 0;
function renderPreview() { cancelAnimationFrame(rafId); rafId = requestAnimationFrame(doRenderPreview); }
function doRenderPreview() {
  const d = doc.design;
  const r = paginate();
  lastPages = r;
  const host = $('#pages');
  const scale = getScale(r.W);
  host.innerHTML = r.pages.map((p, i) => `
    <div class="pwrap" style="width:${r.W * scale}px;height:${r.H * scale}px">
      <div class="${pageClass(d)}" style="width:${r.W}px;height:${r.H}px;transform:scale(${scale})">
        <div class="pc" style="left:${r.mx}px;top:${r.my}px;width:${r.W - 2 * r.mx}px">${p.join('')}</div>
      </div>
      <span class="pno">${i + 1} / ${r.pages.length}</span>
    </div>`).join('');
  $$('.page', host).forEach(el => applyVars(el, d));
  const n = r.pages.length;
  $('#pinfo').innerHTML = `<b>${n} page${n > 1 ? 's' : ''}</b> · ${PAPER[d.paper].label}${n > 1 ? ` · last page ${Math.round(r.fill * 100)}% full` : ''}`;
  $('#zoomVal').textContent = Math.round(scale * 100) + '%';
  if (ui.pview === 'tex') renderTeXView();
}
function getScale(W) {
  if (ui.zoom === 'fit') {
    const cw = $('#canvas').clientWidth - 48;
    return Math.max(0.3, Math.min(1.6, cw / W));
  }
  return ui.zoom;
}

/* ---------------------------------------------------------------------
   LaTeX generator
   --------------------------------------------------------------------- */
function genTeX(d0) {
  const d = d0.design, D = (DENSITY[d.density] || DENSITY.normal).t, P = PAPER[d.paper] || PAPER.letter;
  TEX_LINK = d.linkStyle;
  const sep = ` ${(SEPS[d.separator] || SEPS.bar).tex} `;
  const accent = (d.accent || '#000000').replace('#', '').toUpperCase();
  const ind = d.indent ? `${d.indent}in` : '0in';
  const tabw = d.indent ? '0.97\\textwidth' : '\\textwidth';
  const hdFmt = d.headingStyle === 'smallcaps' ? '\\scshape\\large' : '\\bfseries\\small';
  const hdBefore = d.headingStyle === 'upper' ? '\\MakeUppercase' : '';
  const nameFmt = (d.nameStyle === 'smallcaps' ? '\\scshape' : d.nameStyle === 'bold' ? '\\bfseries' : '') ;
  const L = [];
  const h = d0.header;
  const pdfName = texEsc(h.name || 'Curriculum Vitae');

  L.push(
`%-------------------------------------------------------------------------------
% ${(h.name || 'Curriculum Vitae').replace(/\n/g, ' ')} — CV
% Generated by Typeset (LaTeX CV Studio) on ${new Date().toISOString().slice(0, 10)}
% Compile with pdfLaTeX (e.g. Overleaf, TeX Live, MiKTeX).
% Layout based on Jake Gutierrez's resume template (MIT licence).
%-------------------------------------------------------------------------------
\\documentclass[${P.tex},${d.fontSize}pt]{article}

\\usepackage[T1]{fontenc}
\\usepackage[utf8]{inputenc}
\\usepackage{lmodern}
\\usepackage{latexsym}
\\usepackage[${P.tex},left=${d.marginX}in,right=${d.marginX}in,top=${d.marginY}in,bottom=${d.marginY}in]{geometry}
\\usepackage{titlesec}
\\usepackage[dvipsnames]{xcolor}
\\usepackage{enumitem}
\\usepackage[hidelinks]{hyperref}
\\usepackage{fancyhdr}
\\usepackage[english]{babel}
\\usepackage{tabularx}
\\input{glyphtounicode}

\\definecolor{accent}{HTML}{${accent}}
\\hypersetup{pdftitle={${pdfName} -- CV}, pdfauthor={${pdfName}}}

\\pagestyle{fancy}
\\fancyhf{}
\\fancyfoot{}
\\renewcommand{\\headrulewidth}{0pt}
\\renewcommand{\\footrulewidth}{0pt}

\\urlstyle{same}
\\raggedbottom
\\raggedright
\\setlength{\\tabcolsep}{0in}
\\setlength{\\parindent}{0pt}

% Section headings
\\titleformat{\\section}{\\vspace{${D.sec}pt}${hdFmt}\\color{accent}\\raggedright}{}{0em}{${hdBefore}}[\\color{accent}\\titlerule \\vspace{${D.secA}pt}]

% Make PDF text machine-readable (ATS friendly)
\\pdfgentounicode=1

%-------------------------
% Custom commands
\\newcommand{\\resumeItem}[1]{\\item{\\small\\setlength{\\baselineskip}{${D.lead}em}#1\\par}\\vspace{${D.item}pt}}

\\newcommand{\\resumeSubheading}[4]{
  \\vspace{${D.sub}pt}\\item
    \\begin{tabular*}{${tabw}}[t]{l@{\\extracolsep{\\fill}}r}
      \\textbf{#1} & #2 \\\\
      \\textit{\\small#3} & \\textit{\\small #4} \\\\
    \\end{tabular*}\\vspace{${D.subA}pt}
}

\\newcommand{\\resumeSingleHeading}[2]{
  \\vspace{${D.sub}pt}\\item
    \\begin{tabular*}{${tabw}}[t]{l@{\\extracolsep{\\fill}}r}
      \\textbf{#1} & #2 \\\\
    \\end{tabular*}\\vspace{${D.subA}pt}
}

\\newcommand{\\resumeProjectHeading}[2]{
  \\item
    \\begin{tabular*}{${tabw}}{l@{\\extracolsep{\\fill}}r}
      \\small#1 & #2 \\\\
    \\end{tabular*}\\vspace{${D.subA}pt}
}

\\renewcommand\\labelitemii{${(BULLETS[d.bullet] || BULLETS.bullet).tex}}

\\newcommand{\\resumeSubHeadingListStart}{\\begin{itemize}[leftmargin=${ind}, label={}]}
\\newcommand{\\resumeSubHeadingListEnd}{\\end{itemize}}
\\newcommand{\\resumeItemListStart}{\\begin{itemize}[leftmargin=0.4in, labelsep=0.75em]}
\\newcommand{\\resumeItemListEnd}{\\end{itemize}\\vspace{${D.listEnd}pt}}
${d.extraPreamble ? '\n% Custom preamble\n' + d.extraPreamble + '\n' : ''}
%-------------------------------------------------------------------------------
\\begin{document}
`);

  // Header
  const nameSize = { LARGE: '\\LARGE', huge: '\\huge', Huge: '\\Huge' }[d.nameSize] || '\\LARGE';
  const contacts = h.contacts.filter(c => c.text.trim()).map(c => {
    const url = c.url ? normUrl(c.url) : autoUrl(c.text);
    const t = inlineTeX(c.text);
    return url && !/\\href/.test(t) ? texLink(t, url) : t;
  });
  const hl = [];
  if (h.name) hl.push(`  {${nameSize}${nameFmt}\\color{accent} ${texEsc(h.name)}} \\\\ \\vspace{3pt}`);
  if (h.subtitle) hl.push(`  \\small ${inlineTeX(h.subtitle)} \\\\ \\vspace{1pt}`);
  if (contacts.length) hl.push(`  \\small ${contacts.join(sep)}`);
  if (hl.length) {
    // remove trailing line-break from the last header line
    hl[hl.length - 1] = hl[hl.length - 1].replace(/ \\\\ \\vspace\{\dpt\}$/, '');
    L.push(`%----------HEADING----------\n\\begin{center}\n${hl.join('\n')}\n\\end{center}\n`);
  }

  for (const s of d0.sections) {
    if (s.hidden || !sectionHasContent(s)) continue;
    L.push(`%----------${texEsc(s.title).toUpperCase().replace(/[^A-Z0-9 &\-]/g, '').trim() || 'SECTION'}----------`);
    L.push(`\\section{${inlineTeX(s.title)}}`);
    if (s.type === 'entries' || s.type === 'projects') {
      L.push('  \\resumeSubHeadingListStart');
      for (const it of s.items) {
        if (!itemHasContent(s.type, it)) continue;
        if (s.type === 'entries') {
          if (it.subtitle || it.date) L.push(`    \\resumeSubheading\n      {${inlineTeX(it.title)}}{${inlineTeX(it.location)}}\n      {${inlineTeX(it.subtitle)}}{${inlineTeX(it.date)}}`);
          else L.push(`    \\resumeSingleHeading{${inlineTeX(it.title)}}{${inlineTeX(it.location)}}`);
        } else {
          let l = `\\textbf{${inlineTeX(it.name)}}`;
          if (it.tech) l += ` $|$ \\emph{${inlineTeX(it.tech)}}`;
          if (it.url || it.linkLabel) {
            const lab = inlineTeX(it.linkLabel || it.url.replace(/^https?:\/\//, ''));
            l += ` (${it.url ? texLink(lab, it.url) : lab})`;
          }
          L.push(`    \\resumeProjectHeading\n      {${l}}{${inlineTeX(it.date)}}`);
        }
        const bl = (it.bullets || []).filter(x => String(x).trim());
        if (bl.length) {
          L.push('      \\resumeItemListStart');
          bl.forEach(b => L.push(`        \\resumeItem{${inlineTeX(b)}}`));
          L.push('      \\resumeItemListEnd');
        }
      }
      L.push('  \\resumeSubHeadingListEnd\n');
    } else if (s.type === 'skills') {
      const its = s.items.filter(x => x.label.trim() || x.value.trim());
      L.push(`  \\begin{itemize}[leftmargin=${ind}, label={}]\n    \\small{\\item{`);
      its.forEach((x, i) => {
        const line = (x.label.trim() ? `\\textbf{${inlineTeX(x.label)}}{: ${inlineTeX(x.value)}}` : inlineTeX(x.value));
        L.push(`     ${line}${i < its.length - 1 ? ` \\\\[${D.skl}pt]` : ''}`);
      });
      L.push('    }}\n  \\end{itemize}\n');
    } else if (s.type === 'list') {
      const bl = s.bullets.filter(x => String(x).trim());
      L.push(`  \\begin{itemize}[leftmargin=${d.indent ? `${d.indent + 0.4}in` : '0.4in'}, labelsep=0.75em, label={${(BULLETS[d.bullet] || BULLETS.bullet).tex}}, topsep=2pt, itemsep=0pt]`);
      bl.forEach(b => L.push(`    \\resumeItem{${inlineTeX(b)}}`));
      L.push(`  \\end{itemize}\\vspace{${D.listEnd}pt}\n`);
    } else if (s.type === 'text') {
      const lines = String(s.text || '').split('\n');
      const out = []; let gap = false;
      for (const ln of lines) { if (!ln.trim()) { gap = out.length > 0; continue; } out.push({ ln, gap }); gap = false; }
      L.push(`  \\begin{itemize}[leftmargin=${ind}, label={}]\n    \\small{\\item{`);
      out.forEach((o, i) => {
        const nxt = out[i + 1];
        L.push(`     ${inlineTeX(o.ln)}${nxt ? (nxt.gap ? ' \\\\[6pt]' : ' \\\\') : ''}`);
      });
      L.push('    }}\n  \\end{itemize}\n');
    }
  }
  L.push('%-------------------------------------------------------------------------------\n\\end{document}\n');
  return L.join('\n');
}

function highlightTeX(src) {
  return src.split('\n').map(line => {
    let h = escH(line);
    const ci = findComment(line);
    let code = ci >= 0 ? escH(line.slice(0, ci)) : h, com = ci >= 0 ? `<span class="tx-c">${escH(line.slice(ci))}</span>` : '';
    code = code.replace(/(\\[a-zA-Z@]+\*?|\\.)/g, '<span class="tx-k">$1</span>').replace(/([{}])/g, '<span class="tx-b">$1</span>').replace(/(\$[^$]*\$)/g, '<span class="tx-o">$1</span>');
    return `<span class="ln">${code}${com || ''}${line ? '' : ' '}</span>`;
  }).join('');
}
function findComment(line) { for (let i = 0; i < line.length; i++) { if (line[i] === '%' && (i === 0 || line[i - 1] !== '\\')) return i; } return -1; }
function renderTeXView() { $('#texpre').innerHTML = highlightTeX(genTeX(doc)); }

function ta(path, ph, cls = '') { return `<textarea class="ta ${cls}" rows="1" data-path="${path}" placeholder="${escH(ph)}">${escH(getPath(doc, path))}</textarea>`; }

/* ---------------------------------------------------------------------
   Editor events
   --------------------------------------------------------------------- */
function onEdit() { persist(); renderPreview(); histCommit(); }

function setupEditorEvents() {
  const ed = $('#editor');
  ed.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.path) {
      setPath(doc, t.dataset.path, t.value);
      if (t.tagName === 'TEXTAREA') autoGrow(t);
      // live-update collapsed item labels
      const item = t.closest('.item');
      if (item && /\.(title|subtitle|name|tech)$/.test(t.dataset.path)) {
        const p = t.dataset.path.replace(/\.\w+$/, ''), it = getPath(doc, p), lb = $('.lbl', item);
        if (lb && it) lb.innerHTML = it.title !== undefined ? `${escH(it.title || 'New entry')}${it.subtitle ? ` <em>· ${escH(it.subtitle)}</em>` : ''}` : `${escH(it.name || 'New project')}${it.tech ? ` <em>· ${escH(it.tech)}</em>` : ''}`;
      }
      onEdit();
    } else if (t.matches('[data-dcolor]')) { doc.design.accent = t.value; doc.design.preset = null; onEdit(); }
    else if (t.matches('[data-dpre]')) { doc.design.extraPreamble = t.value; persist(); histCommit(); if (ui.pview === 'tex') renderTeXView(); }
  });
  ed.addEventListener('change', e => { if (e.target.matches('[data-dcolor]')) renderEditor(); });

  ed.addEventListener('click', e => {
    const b = e.target.closest('[data-act],[data-dkey],[data-preset],#addSecBtn,[data-act-g]');
    if (!b) return;
    if (b.id === 'addSecBtn') return openAddSection(b);
    if (b.dataset.actG) return globalAct(b.dataset.actG, b);
    if (b.dataset.preset) {
      Object.assign(doc.design, DESIGN_PRESETS[b.dataset.preset].d, { preset: b.dataset.preset });
      histCommit(true); onEdit(); renderEditor(); return;
    }
    if (b.dataset.dkey) {
      const k = b.dataset.dkey, v = b.dataset.dval;
      doc.design[k] = typeof DEFAULT_DESIGN[k] === 'number' ? +v : v;
      if (['headingStyle', 'nameStyle', 'nameSize', 'accent', 'indent', 'linkStyle', 'density', 'bullet', 'separator'].includes(k)) doc.design.preset = null;
      histCommit(true); onEdit(); renderEditor(); return;
    }
    act(b.dataset.act, b);
  });

  ed.addEventListener('keydown', e => {
    const t = e.target;
    if (t.classList.contains('bullet')) {
      const { arr, idx, arrPath } = parentOf(t.dataset.path);
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        const pos = t.selectionStart, v = t.value;
        arr[idx] = v.slice(0, pos); arr.splice(idx + 1, 0, v.slice(pos).trimStart());
        histCommit(true); onEdit(); renderEditor();
        const n = $(`[data-path="${arrPath}.${idx + 1}"]`); if (n) { n.focus(); n.setSelectionRange(0, 0); }
      } else if (e.key === 'Backspace' && t.selectionStart === 0 && t.selectionEnd === 0 && idx > 0) {
        e.preventDefault();
        const prevLen = arr[idx - 1].length;
        arr[idx - 1] += arr[idx]; arr.splice(idx, 1);
        histCommit(true); onEdit(); renderEditor();
        const p = $(`[data-path="${arrPath}.${idx - 1}"]`); if (p) { p.focus(); p.setSelectionRange(prevLen, prevLen); }
      } else if (e.key === 'ArrowUp' && t.selectionStart === 0 && idx > 0) {
        const p = $(`[data-path="${arrPath}.${idx - 1}"]`); if (p) { e.preventDefault(); p.focus(); }
      } else if (e.key === 'ArrowDown' && t.selectionStart === t.value.length && idx < arr.length - 1) {
        const n = $(`[data-path="${arrPath}.${idx + 1}"]`); if (n) { e.preventDefault(); n.focus(); n.setSelectionRange(0, 0); }
      }
    }
  });

  // Track last focused field for the formatting toolbar
  ed.addEventListener('focusin', e => { if (e.target.dataset.path) lastField = e.target; });

  // Drag & drop sections
  let dragFrom = null;
  ed.addEventListener('dragstart', e => {
    const g = e.target.closest('[data-drag]'); if (!g) return;
    dragFrom = +g.dataset.drag; const card = g.closest('.card');
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragFrom));
    try { e.dataTransfer.setDragImage(card, 20, 20); } catch {}
    setTimeout(() => card.classList.add('dragging'), 0);
  });
  ed.addEventListener('dragover', e => {
    if (dragFrom == null) return;
    const card = e.target.closest('.card.sec'); if (!card) return;
    e.preventDefault();
    $$('.drop-before,.drop-after', ed).forEach(c => c.classList.remove('drop-before', 'drop-after'));
    const r = card.getBoundingClientRect();
    card.classList.add(e.clientY < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
  });
  ed.addEventListener('drop', e => {
    if (dragFrom == null) return;
    const card = e.target.closest('.card.sec'); if (!card) return;
    e.preventDefault();
    let to = +card.dataset.si + (card.classList.contains('drop-after') ? 1 : 0);
    const [s] = doc.sections.splice(dragFrom, 1); if (to > dragFrom) to--;
    doc.sections.splice(to, 0, s); dragFrom = null;
    histCommit(true); onEdit(); renderEditor();
  });
  ed.addEventListener('dragend', () => { dragFrom = null; $$('.dragging,.drop-before,.drop-after', ed).forEach(c => c.classList.remove('dragging', 'drop-before', 'drop-after')); });
}

function act(a, b) {
  const p = b.dataset.path;
  if (a === 'collapse') { const id = b.dataset.id; ui.collapsed[id] = !ui.collapsed[id]; saveUI(); const el = b.closest('.item') || b.closest('.card'); el.classList.toggle('collapsed'); if (!ui.collapsed[id]) $$('.ta', el).forEach(autoGrow); return; }
  if (a === 'add') {
    const arr = getPath(doc, p), tpl = b.dataset.tpl;
    const v = tpl === 'bullet' ? '' : T[tpl]();
    arr.push(v); histCommit(true); onEdit(); renderEditor();
    const sel = tpl === 'bullet' ? `[data-path="${p}.${arr.length - 1}"]` : `[data-path^="${p}.${arr.length - 1}."]`;
    const el = $(sel, $('#editor')); if (el) { el.focus(); el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    return;
  }
  if (a === 'del') {
    const { arr, idx } = parentOf(p);
    const removed = arr[idx];
    const what = p.split('.').length === 2 && p.startsWith('sections') ? `Section “${removed.title}” deleted` : (typeof removed === 'string' ? 'Bullet deleted' : 'Item deleted');
    arr.splice(idx, 1); histCommit(true); onEdit(); renderEditor();
    if (typeof removed !== 'string' || removed.trim()) toast(what, 'Undo', undo);
    return;
  }
  if (a === 'move') {
    const { arr, idx } = parentOf(p), to = idx + (+b.dataset.dir);
    if (to < 0 || to >= arr.length) return;
    [arr[idx], arr[to]] = [arr[to], arr[idx]];
    histCommit(true); onEdit(); renderEditor(); return;
  }
  if (a === 'dup') {
    const { arr, idx } = parentOf(p); const c = clone(arr[idx]); c.id = uid();
    arr.splice(idx + 1, 0, c); histCommit(true); onEdit(); renderEditor(); return;
  }
  if (a === 'hide') { const s = getPath(doc, p); s.hidden = !s.hidden; histCommit(true); onEdit(); renderEditor(); return; }
}

/* ---- formatting toolbar ---- */
let lastField = null;
function applyFmt(kind, el = lastField) {
  if (!el || !document.body.contains(el)) return;
  el.focus();
  const s = el.selectionStart, e = el.selectionEnd, v = el.value, sel = v.slice(s, e);
  let ins, cs, ce;
  if (kind === 'b') { ins = `**${sel || 'bold'}**`; cs = s + 2; ce = cs + (sel || 'bold').length; }
  else if (kind === 'i') { ins = `*${sel || 'italic'}*`; cs = s + 1; ce = cs + (sel || 'italic').length; }
  else { const url = /^\S+\.\S+$/.test(sel) ? sel : 'https://'; ins = `[${sel || 'link text'}](${url})`; cs = s + ins.length - 1 - url.length; ce = cs + url.length; }
  el.setRangeText(ins, s, e, 'end'); el.setSelectionRange(cs, ce);
  el.dispatchEvent(new Event('input', { bubbles: true }));
}

/* ---------------------------------------------------------------------
   Menus, toasts, modals
   --------------------------------------------------------------------- */
let openPop = null;
function closePop() { if (openPop) { openPop.remove(); openPop = null; document.removeEventListener('mousedown', popOutside, true); } }
function popOutside(e) { if (openPop && !openPop.contains(e.target) && !e.target.closest('[data-popowner]')) closePop(); }
function popover(anchor, html, align = 'left') {
  closePop();
  const p = document.createElement('div'); p.className = 'pop'; p.innerHTML = html; p.setAttribute('role', 'menu');
  document.body.appendChild(p);
  const r = anchor.getBoundingClientRect(), pw = p.offsetWidth, ph = p.offsetHeight;
  let x = align === 'right' ? r.right - pw : r.left; x = Math.max(8, Math.min(x, innerWidth - pw - 8));
  let y = r.bottom + 6; if (y + ph > innerHeight - 8) y = Math.max(8, r.top - ph - 6);
  p.style.left = x + 'px'; p.style.top = y + 'px';
  openPop = p; setTimeout(() => document.addEventListener('mousedown', popOutside, true), 0);
  const f = p.querySelector('button'); if (f) f.focus();
  p.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closePop(); anchor.focus(); }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const bs = $$('.mi', p); const i = bs.indexOf(document.activeElement); bs[(i + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length].focus(); }
  });
  return p;
}

function openAddSection(anchor) {
  const p = popover(anchor, `<div class="mlabel">Add a section</div>` + SECTION_PRESETS.map(s => `<button class="mi" data-k="${s.key}"><span>${s.label}<small>${s.hint}</small></span><span class="kbd" style="margin-left:auto">${TYPE_LABEL[s.type]}</span></button>`).join(''));
  p.style.maxHeight = '60vh'; p.style.overflow = 'auto';
  p.addEventListener('click', e => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    const pr = SECTION_PRESETS.find(x => x.key === b.dataset.k);
    const s = newSection(pr.type, pr.label);
    doc.sections.push(s); closePop(); histCommit(true); onEdit(); renderEditor();
    const card = $(`.card[data-id="${s.id}"]`); if (card) { card.scrollIntoView({ behavior: 'smooth', block: 'start' }); const f = $('input.inp, textarea', card); if (f) setTimeout(() => f.focus({ preventScroll: true }), 300); }
  });
}

function openDocs(anchor) {
  const docs = Object.values(store.docs).sort((a, b) => b.updated - a.updated);
  const rel = t => { const s = (Date.now() - t) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.floor(s / 60) + ' min ago' : s < 86400 ? Math.floor(s / 3600) + ' h ago' : new Date(t).toLocaleDateString(); };
  const p = popover(anchor, `<div class="mlabel">Your CVs · stored on this device</div>
    ${docs.map(d => `<div class="docrow${d.id === doc.id ? ' cur' : ''}"><button class="mi" data-open="${d.id}">${icon('file')}<span>${escH(d.name)}<small>${escH(d.header.name || '—')} · ${rel(d.updated)}</small></span></button>
      <button class="ibtn" data-rename="${d.id}" title="Rename">${icon('pen')}</button><button class="ibtn" data-dupdoc="${d.id}" title="Duplicate">${icon('dup')}</button><button class="ibtn danger" data-deldoc="${d.id}" title="Delete">${icon('trash')}</button></div>`).join('')}
    <div class="mhr"></div>
    <button class="mi" data-new="blank">${icon('plus')}<span>New blank CV</span></button>
    <button class="mi" data-new="sample">${icon('layers')}<span>New from sample</span></button>`);
  p.style.minWidth = '320px';
  p.addEventListener('click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.open) { switchDoc(t.dataset.open); closePop(); }
    else if (t.dataset.new) { const d = t.dataset.new === 'blank' ? blankDoc() : sampleDoc(); store.docs[d.id] = d; switchDoc(d.id); closePop(); toast('New CV created'); }
    else if (t.dataset.dupdoc) { const d = clone(store.docs[t.dataset.dupdoc]); d.id = uid(); d.name += ' (copy)'; d.updated = Date.now(); store.docs[d.id] = d; switchDoc(d.id); closePop(); }
    else if (t.dataset.rename) { closePop(); renameDoc(t.dataset.rename); }
    else if (t.dataset.deldoc) {
      const id = t.dataset.deldoc, d = store.docs[id]; closePop();
      confirmModal('Delete this CV?', `“${escH(d.name)}” will be removed from this browser. This can’t be undone unless you exported a backup.`, 'Delete', () => {
        delete store.docs[id];
        if (!Object.keys(store.docs).length) { const s = blankDoc(); store.docs[s.id] = s; }
        if (id === doc.id) switchDoc(Object.values(store.docs).sort((a, b) => b.updated - a.updated)[0].id); else saveNow();
        toast('CV deleted');
      }, true);
    }
  });
}
function switchDoc(id) { saveNow(); store.current = id; doc = store.docs[id]; saveNow(); histReset(); renderEditor(); renderPreview(); }
function renameDoc(id) {
  const d = store.docs[id];
  const m = modal(`<h3>Rename CV</h3><p>A label for your own reference — it doesn’t appear on the CV.</p><input class="inp" id="rnIn" value="${escH(d.name)}" style="margin-top:6px"><div class="acts"><button class="btn" data-close>Cancel</button><button class="btn primary" id="rnOk">Save</button></div>`);

  $('#rnOk', m).onclick = ok; i.onkeydown = e => { if (e.key === 'Enter') ok(); };

function toast(msg, actLabel, fn) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status');
  t.innerHTML = `<span>${escH(msg)}</span>${actLabel ? `<button>${escH(actLabel)}</button>` : ''}`;
  if (fn) t.querySelector('button').onclick = () => { fn(); t.remove(); };
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), actLabel ? 6000 : 2600);
}
function modal(html) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(bg);
  bg.close = () => bg.remove();
  bg.addEventListener('mousedown', e => { if (e.target === bg) bg.close(); });
  bg.addEventListener('click', e => { if (e.target.closest('[data-close]')) bg.close(); });
  bg.addEventListener('keydown', e => { if (e.key === 'Escape') bg.close(); });
  return bg;
}
function confirmModal(title, body, okLabel, fn, danger) {
  const m = modal(`<h3>${title}</h3><p>${body}</p><div class="acts"><button class="btn" data-close>Cancel</button><button class="btn primary" id="cOk" ${danger ? 'style="background:var(--danger);border-color:var(--danger);color:#fff"' : ''}>${okLabel}</button></div>`);
  $('#cOk', m).onclick = () => { m.close(); fn(); }; $('#cOk', m).focus();
}

/* ---------------------------------------------------------------------
   Export / import
   --------------------------------------------------------------------- */
function fileBase() { return (doc.header.name || doc.name || 'CV').trim().replace(/[^\w\-. ]+/g, '').replace(/\s+/g, '_') + '_CV'; }
function download(name, text, type) {
  const blob = new Blob([text], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function downloadTeX() { download(fileBase() + '.tex', genTeX(doc), 'application/x-tex'); toast('LaTeX source downloaded'); }
async function copyTeX() {
  const s = genTeX(doc);
  try { await navigator.clipboard.writeText(s); }
  catch { const t = document.createElement('textarea'); t.value = s; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast('LaTeX copied to clipboard');
}
function exportJSON() { saveNow(); download(fileBase() + '.json', JSON.stringify({ app: 'typeset-cv', version: 1, doc }, null, 2), 'application/json'); toast('Backup saved'); }
function openOverleaf() {
  const f = document.createElement('form'); f.method = 'POST'; f.action = 'https://www.overleaf.com/docs'; f.target = '_blank';
  const add = (n, v) => { const i = document.createElement('input'); i.type = 'hidden'; i.name = n; i.value = v; f.appendChild(i); };
  add('snip', genTeX(doc)); add('engine', 'pdflatex'); add('snip_name', fileBase() + '.tex');
  document.body.appendChild(f); f.submit(); f.remove();
}
function importFile(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      const list = o.docs ? Object.values(o.docs) : [o.doc || o];
      let last;
      for (const raw of list) {
        if (!raw || (!raw.header && !raw.sections)) throw new Error('Not a CV backup');
        const d = normalizeDoc(clone(raw));
        if (store.docs[d.id]) d.id = uid();
        store.docs[d.id] = d; last = d;
      }
      switchDoc(last.id); toast(list.length > 1 ? `${list.length} CVs imported` : `Imported “${last.name}”`);
    } catch (e) { toast('That file isn’t a valid CV backup (.json)'); }
  };
  r.readAsText(file);
}

function buildPrint() {
  const r = paginate();
  const d = doc.design, P = PAPER[d.paper];
  const root = $('#print-root');
  root.innerHTML = r.pages.map(p => `<div class="${pageClass(d)}" style="width:${P.w}in;height:${P.h}in"><div class="pc" style="left:${d.marginX}in;top:${d.marginY}in;width:${P.w - 2 * d.marginX}in">${p.join('')}</div></div>`).join('');
  $$('.page', root).forEach(el => applyVars(el, d));
  let st = $('#pagesize'); if (!st) { st = document.createElement('style'); st.id = 'pagesize'; document.head.appendChild(st); }
  st.textContent = `@page{size:${P.w}in ${P.h}in;margin:0}`;
}
function exportPDF() {
  const doPrint = () => {
    buildPrint();
    const oldTitle = document.title; document.title = fileBase();
    const done = () => { document.title = oldTitle; $('#print-root').innerHTML = ''; window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => window.print(), 50);
  };
  if (!ui.printTipSeen) {
    const m = modal(`<h3>Save your CV as PDF</h3><p>Your browser’s print dialog will open with the CV laid out page-for-page.</p>
      <ol><li>Set <b>Destination</b> to <b>Save as PDF</b>.</li><li>Set <b>Margins</b> to <b>None</b> or <b>Default</b> (the CV has its own).</li><li>Turn <b>off</b> “Headers and footers”.</li></ol>
      <p>The text stays real, selectable text — friendly for applicant tracking systems. For a pdfLaTeX-compiled PDF, export the <b>.tex</b> file instead.</p>
      <div class="acts"><button class="btn" data-close>Cancel</button><button class="btn primary" id="pOk">${icon('printer')}Continue</button></div>`);
    $('#pOk', m).onclick = () => { ui.printTipSeen = true; saveUI(); m.close(); doPrint(); };
    $('#pOk', m).focus();
  } else doPrint();
}

function globalAct(a) {
  if (a === 'copytex') copyTeX();
  if (a === 'dltex') { if (FRAMED) return framedNotice(); downloadTeX(); }
  if (a === 'resetdesign') { doc.design = Object.assign(clone(DEFAULT_DESIGN), { extraPreamble: doc.design.extraPreamble }); histCommit(true); onEdit(); renderEditor(); toast('Design reset'); }
}

/* ---------------------------------------------------------------------
   Global UI wiring
   --------------------------------------------------------------------- */
function applyTheme() {
  const dark = ui.theme ? ui.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('#themeBtn use').setAttribute('href', dark ? '#i-sun' : '#i-moon');
}
function setTab(t) { ui.tab = t; saveUI(); $$('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === t))); renderEditor(); }
function setPView(v) {
  ui.pview = v; saveUI();
  $$('[data-pview]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.pview === v)));
  $('#stage').classList.toggle('show-tex', v === 'tex');
  $('#texActs').style.display = v === 'tex' ? 'flex' : 'none';
  if (v === 'tex') renderTeXView();
}
function setView(v) { $('#app').dataset.view = v; $$('.mobile-switch button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v))); if (v === 'preview') renderPreview(); }
function zoom(dir) {
  const cur = getScale(lastPages.W || 816);
  ui.zoom = dir === 'fit' ? 'fit' : Math.max(0.3, Math.min(2, +(cur + dir * 0.1).toFixed(2)));
  saveUI(); renderPreview();
}

function init() {
  loadStore();
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
  histReset();
  setupEditorEvents();
  $$('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));
  $$('.tab').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab)));
  $$('[data-pview]').forEach(b => b.onclick = () => setPView(b.dataset.pview));
  $$('.mobile-switch button').forEach(b => b.onclick = () => setView(b.dataset.view));
  $('#texActs').addEventListener('click', e => { const b = e.target.closest('[data-act-g]'); if (b) globalAct(b.dataset.actG); });
  $('#fmtbar').addEventListener('mousedown', e => { const b = e.target.closest('[data-fmt]'); if (b) { e.preventDefault(); applyFmt(b.dataset.fmt); } });
  $('#docBtn').onclick = e => openDocs(e.currentTarget);
  $('#exportBtn').onclick = e => openExport(e.currentTarget);
  $('#docBtn').dataset.popowner = 1; $('#exportBtn').dataset.popowner = 1;
  $('#importBtn').onclick = () => $('#fileIn').click();
  $('#fileIn').onchange = e => { const f = e.target.files[0]; if (f) importFile(f); e.target.value = ''; };
  $('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;
  $('#themeBtn').onclick = () => { ui.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; saveUI(); applyTheme(); };
  $('#zoomIn').onclick = () => zoom(1); $('#zoomOut').onclick = () => zoom(-1); $('#zoomFit').onclick = () => zoom('fit');

  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey; if (!mod) return;
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { if (e.target.closest && e.target.closest('#editor') && !hist.past.length) return; e.preventDefault(); undo(); }
    else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(); }
    else if (k === 's') { e.preventDefault(); FRAMED ? framedNotice() : exportJSON(); }
    else if (k === 'p') { e.preventDefault(); FRAMED ? framedNotice() : exportPDF(); }
    else if (k === 'b' && e.target.dataset && e.target.dataset.path) { e.preventDefault(); applyFmt('b', e.target); }
    else if (k === 'i' && e.target.dataset && e.target.dataset.path) { e.preventDefault(); applyFmt('i', e.target); }
    else if (k === 'k' && e.target.dataset && e.target.dataset.path) { e.preventDefault(); applyFmt('a', e.target); }
  });
  // Drop a backup JSON anywhere
  document.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  document.addEventListener('drop', e => { const f = e.dataTransfer && e.dataTransfer.files[0]; if (f) { e.preventDefault(); importFile(f); } });

  let rt; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(() => { if (ui.zoom === 'fit') renderPreview(); }, 60); }).observe($('#canvas'));
  window.addEventListener('storage', e => { if (e.key === STORE_KEY) { loadStore(); histReset(); renderEditor(); renderPreview(); } });
  window.addEventListener('beforeunload', saveNow);

  if (innerWidth <= 980) setView('edit');
  renderEditor();
  setPView(ui.pview);
  renderPreview();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderPreview);

  // test hooks
  window.__typeset = { genTeX: () => genTeX(doc), store: () => store, load: o => { const d = normalizeDoc(o); store.docs[d.id] = d; switchDoc(d.id); }, design: o => { Object.assign(doc.design, o); renderPreview(); }, buildPrint };
}
init();
})();

</script>
